<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="arrow-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="250" cy="250" r="234" fill="none" stroke="url(#ring)" stroke-width="20"/>

  <!-- Inner dark background -->
  <circle cx="250" cy="250" r="224" fill="#141414"/>

  <!-- S letter (white) -->
  <g transform="translate(250, 175)">
    <!-- S shape -->
    <path d="
      M -30,-38
      C -30,-55 -12,-55 -2,-55
      C 12,-55 16,-48 16,-40
      C 16,-26 -30,-14 -30,0
      C -30,16 12,24 30,38
      L 30,52
      L -30,52
      Z
    " fill="#FFFFFF"/>
  </g>

  <!-- F letter (gold, stylized with chart integration) -->
  <g transform="translate(270, 175)">
    <!-- F shape -->
    <path d="
      M -16,-58
      L 24,-58
      L 24,-42
      L 2,-42
      L 2,-10
      L 20,-10
      L 20,4
      L 2,4
      L 2,42
      L 18,42
      L 32,52
      L -16,52
      Z
    " fill="url(#gold)"/>

    <!-- Chart bars growing from bottom right of F -->
    <rect x="8" y="-10" width="6" height="14" rx="2" fill="#C9A84C" opacity="0.6"/>
    <rect x="18" y="-18" width="6" height="22" rx="2" fill="#D4AF37" opacity="0.8"/>
    <rect x="28" y="-28" width="6" height="32" rx="2" fill="#D4AF37"/>

    <!-- Arrow pointing up-right -->
    <polygon points="40,-52 52,-28 58,-32 46,-56 40,-52Z" fill="url(#arrow-gold)"/>
  </g>

  <!-- ScaleFlow text -->
  <g transform="translate(250, 310)">
    <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" text-anchor="middle">
      <tspan fill="#FFFFFF">Scale</tspan>
      <tspan fill="#C9A84C">Flow</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(250, 345)">
    <line x1="-110" y1="0" x2="-18" y2="0" stroke="#C9A84C" stroke-width="1.5"/>
    <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#C9A84C" text-anchor="middle" letter-spacing="3.5">STRATEGIC GROWTH PARTNER</text>
    <line x1="18" y1="0" x2="110" y2="0" stroke="#C9A84C" stroke-width="1.5"/>
  </g>
</svg>

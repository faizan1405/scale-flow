<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#E8D5A8"/>
    </linearGradient>
  </defs>
  <!-- Decorative elements -->
  <circle cx="250" cy="315" r="280" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.12"/>
  <circle cx="250" cy="315" r="220" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.08"/>
  <!-- ScaleFlow wordmark -->
  <text x="600" y="300" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="96" font-weight="700">
    <tspan fill="#F5F5F5">Scale</tspan>
    <tspan fill="#C9A84C">Flow</tspan>
  </text>
  <line x1="400" y1="330" x2="800" y2="330" stroke="url(#gold-grad)" stroke-width="2"/>
  <text x="600" y="370" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#CCCCCC" letter-spacing="4">STRATEGIC GROWTH PARTNER</text>
</svg>
